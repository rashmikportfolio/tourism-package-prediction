name: Tourism Package MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Verify deployment files
      - name: Verify deployment files
        run: |
          test -f app.py
          test -f Dockerfile
          test -f requirements.txt
          echo "Deployment files verified successfully."

      # 5. Verify Python application
      - name: Validate application
        run: |
          python -m py_compile app.py
          echo "Application syntax verified successfully."

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t tourism-package-prediction .

      # 7. Complete pipeline
      - name: Pipeline completed
        run: |
          echo "Tourism Package Prediction MLOps pipeline completed successfully."
