name: Tourism Package MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    # Give the ML script access to the Hugging Face token
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:

      # 1. Checkout the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the complete ML pipeline
      - name: Run ML pipeline
        run: |
          python ml_pipeline.py

      # 5. Verify deployment files
      - name: Verify deployment files
        run: |
          test -f app.py
          test -f Dockerfile
          test -f requirements.txt
          echo "Deployment files verified successfully."

      # 6. Verify Python applications
      - name: Validate applications
        run: |
          python -m py_compile ml_pipeline.py
          python -m py_compile app.py
          echo "Python applications validated successfully."

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t tourism-package-prediction .

      # 8. Complete pipeline
      - name: Pipeline completed
        run: |
          echo "Tourism Package Prediction MLOps pipeline completed successfully."
